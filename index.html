<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>近鉄大阪線 次列車案内｜安堂～河内国分 平日</title>
<style>
:root {
  --bg: rgba(8, 12, 18, .88);
  --card: rgba(255,255,255,.075);
  --line: rgba(255,255,255,.17);
  --text: #fff;
  --sub: rgba(255,255,255,.70);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  overflow: hidden;
}
.wrap {
  width: 100vw;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.header {
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
}
.header .title {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .04em;
  white-space: nowrap;
}
.header .meta {
  font-size: 8px;
  color: var(--sub);
  white-space: nowrap;
}
.direction {
  height: 52px;
  display: grid;
  grid-template-columns: 132px minmax(0, 1fr) minmax(0, 1fr);
  gap: 6px;
  padding: 4px 6px;
  border-bottom: 1px solid var(--line);
}
.direction:last-of-type { border-bottom: 0; }
.dirlabel {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 8px;
  border-radius: 7px;
  background: rgba(255,255,255,.06);
  min-width: 0;
}
.dirlabel .arrow {
  font-size: 20px;
  line-height: 1;
  font-weight: 900;
  flex: 0 0 auto;
}
.dirlabel .name {
  margin: 0;
  font-size: 13px;
  font-weight: 900;
  white-space: nowrap;
}
.dirlabel .small {
  display: none;
}
.train {
  min-width: 0;
  padding: 3px 8px;
  border-radius: 7px;
  background: var(--card);
  display: grid;
  grid-template-columns: 43px 68px 86px minmax(0,1fr) 86px;
  align-items: center;
  gap: 7px;
}
.train .tag {
  font-size: 8px;
  color: var(--sub);
  letter-spacing: .08em;
  font-weight: 800;
  white-space: nowrap;
}
.mainline {
  display: contents;
}
.time {
  font-size: 18px;
  line-height: 1;
  font-weight: 900;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.type {
  justify-self: start;
  padding: 2px 5px;
  border-radius: 5px;
  font-size: 10px;
  line-height: 1.1;
  font-weight: 900;
  background: rgba(255,255,255,.13);
  white-space: nowrap;
}
.type.limited { background: rgba(210, 55, 55, .78); }
.type.rapid { background: rgba(205, 117, 30, .78); }
.type.express { background: rgba(184, 77, 46, .78); }
.type.semi { background: rgba(50, 132, 90, .78); }
.type.local { background: rgba(47, 105, 170, .78); }
.dest {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 850;
}
.bottom {
  display: contents;
}
.bottom > span:first-child {
  display: none;
}
.countdown {
  text-align: right;
  font-size: 9px;
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
}
.warn {
  display: none;
  height: 18px;
  padding: 2px 10px;
  border-top: 1px solid var(--line);
  font-size: 8px;
  font-weight: 800;
  text-align: center;
  background: rgba(170, 58, 35, .78);
}
.empty {
  grid-column: 1 / -1;
  color: var(--sub);
  font-size: 11px;
  font-weight: 700;
  padding: 0;
}
@media (max-width: 900px) {
  .header .meta { display: none; }
  .direction {
    grid-template-columns: 105px minmax(0,1fr) minmax(0,1fr);
  }
  .dirlabel .name { font-size: 11px; }
  .train {
    grid-template-columns: 34px 58px 74px minmax(0,1fr) 70px;
    gap: 5px;
    padding: 3px 6px;
  }
  .time { font-size: 16px; }
  .type { font-size: 9px; }
  .dest { font-size: 11px; }
  .countdown { font-size: 8px; }
}
</style>
</head>

  t:64935, type:"しまかぜ", dest:"大阪難波",
  conf:"C", unc:60, basis:"大和八木基準補間"
};
const SHIMAKAZE_SOUTH = {
  t:39495, type:"しまかぜ", dest:"賢島",
  conf:"C", unc:60, basis:"鶴橋基準補間"
};

if (INCLUDE_SHIMAKAZE) {
  NORTH.push(SHIMAKAZE_NORTH);
  SOUTH.push(SHIMAKAZE_SOUTH);
  NORTH.sort((a,b)=>a.t-b.t);
  SOUTH.sort((a,b)=>a.t-b.t);
}

function jstParts() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Tokyo",
    year: "numeric", month: "numeric", day: "numeric",
    hour: "numeric", minute: "numeric", second: "numeric",
    hourCycle: "h23"
  }).formatToParts(new Date());
  const o = {};
  for (const p of parts) if (p.type !== "literal") o[p.type] = Number(p.value);
  return o;
}

function serviceNow() {
  const p = jstParts();
  let sec = p.hour*3600 + p.minute*60 + p.second;
  let serviceDate = new Date(Date.UTC(p.year, p.month-1, p.day));
  if (p.hour < 4) {
    sec += 86400;
    serviceDate.setUTCDate(serviceDate.getUTCDate()-1);
  }
  return {sec, dow: serviceDate.getUTCDay()};
}

function pad2(n) { return String(n).padStart(2,"0"); }

function estimatedClock(t) {
  // 中心推定値を最寄り1分へ丸めて表示
  const rounded = Math.round(t/60)*60;
  const h = Math.floor(rounded/3600)%24;
  const m = Math.floor((rounded%3600)/60);
  return `${pad2(h)}:${pad2(m)}頃`;
}

function countdownText(delta) {
  if (delta <= 0) return "まもなく";
  const m = Math.floor(delta/60);
  const s = Math.floor(delta%60);
  return `目安 ${pad2(m)}:${pad2(s)}`;
}

function typeClass(type) {
  if (["ひのとり","UL","V","ISL","特急","しまかぜ"].includes(type)) return "limited";
  if (type === "快速急行") return "rapid";
  if (["急行","区間急行"].includes(type)) return "express";
  if (["準急","区間準急"].includes(type)) return "semi";
  return "local";
}

function typeLabel(type) {
  const map = {
    "UL":"特急 UL",
    "V":"特急 V",
    "ISL":"特急 ISL",
    "ひのとり":"ひのとり",
    "しまかぜ":"しまかぜ"
  };
  return map[type] || type;
}

function findNext(list, nowSec) {
  return list.filter(x => x.t >= nowSec - HOLD_AFTER_ESTIMATE).slice(0,2);
}

function renderTrain(el, train, index, nowSec) {
  if (!train) {
    el.innerHTML = `<div class="empty">本日の案内終了</div>`;
    return;
  }
  const delta = train.t - nowSec;
  const acc = SHOW_ACCURACY
    ? `<span>推定${train.conf}・±約${train.unc}秒</span>`
    : `<span>推定通過</span>`;
  el.innerHTML = `
    <div class="tag">${index===0 ? "NEXT" : "NEXT 2"}</div>
    <div class="mainline">
      <div class="time">${estimatedClock(train.t)}</div>
      <div class="type ${typeClass(train.type)}">${typeLabel(train.type)}</div>
      <div class="dest">${train.dest}</div>
    </div>
    <div class="bottom">
      ${acc}
      <span class="countdown">${countdownText(delta)}</span>
    </div>`;
}

function update() {
  const now = serviceNow();
  const n = findNext(NORTH, now.sec);
  const s = findNext(SOUTH, now.sec);

  renderTrain(document.getElementById("north1"), n[0], 0, now.sec);
  renderTrain(document.getElementById("north2"), n[1], 1, now.sec);
  renderTrain(document.getElementById("south1"), s[0], 0, now.sec);
  renderTrain(document.getElementById("south2"), s[1], 1, now.sec);

  const warn = document.getElementById("warn");
  if (now.dow === 0 || now.dow === 6) {
    warn.style.display = "block";
    warn.textContent = "このページは平日版です（土休日ダイヤではありません）";
  } else {
    warn.style.display = "none";
  }
}

update();
setInterval(update, 1000);
