<html lang="ja">
<head>
<meta charset="UTF-8">

<title>近鉄大阪線 次列車案内</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 padding:0;
 background:transparent;
 overflow:hidden;
 width:100%;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
 color:#fff;
}

body{
 display:flex;
 align-items:flex-end;
 justify-content:center;
 padding-bottom:10px;
}

.board{
 width:100vw;
 height:88px;
 display:grid;
 grid-template-columns:minmax(0,1fr) minmax(0,1fr);
 gap:4px;
 padding:3px;
 background:rgba(5,9,15,.90);
 border:1px solid rgba(255,255,255,.20);
 border-radius:9px;
 overflow:hidden;
 backdrop-filter:blur(5px);
 -webkit-backdrop-filter:blur(5px);
}
.panel{
 min-width:0;
 display:grid;
 grid-template-rows:18px minmax(0,1fr) minmax(0,1fr);
 gap:2px;
 padding:2px;
 border-radius:7px;
 background:rgba(255,255,255,.035)
}
.panel.osaka{border-right:1px solid rgba(255,255,255,.12)}
.dir{
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:5px;
 background:rgba(255,255,255,.08);
 font-weight:900;
 white-space:nowrap
}
.dname{font-size:13px;letter-spacing:.02em}
.train{
 min-width:0;
 display:grid;
 grid-template-columns:32px 80px 72px minmax(72px,1fr) 112px;
 gap:4px;
 align-items:center;
 padding:1px 6px;
 border-radius:5px;
 background:rgba(255,255,255,.07)
}
.tag{
 font-size:8px;
 font-weight:900;
 letter-spacing:.06em;
 color:rgba(255,255,255,.70);
 white-space:nowrap
}
.time{
 font-size:20px;
 font-weight:950;
 line-height:1;
 font-variant-numeric:tabular-nums;
 white-space:nowrap;
 padding-right:2px
}
.type{
 justify-self:start;
 padding:2px 5px;
 border-radius:5px;
 font-size:10px;
 font-weight:950;
 white-space:nowrap;
 background:rgba(255,255,255,.15)
}
.type.limited{background:rgba(184,58,58,.82)}
.type.rapid{background:rgba(205,117,30,.82)}
.type.express{background:rgba(173,76,48,.82)}
.type.semi{background:rgba(43,127,87,.82)}
.type.local{background:rgba(44,100,163,.82)}
.dest{
 min-width:0;
 font-size:13px;
 font-weight:900;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}
.no{
 font-size:9px;
 font-weight:700;
 color:rgba(255,255,255,.66);
 margin-left:5px;
 white-space:nowrap
}
.cd{
 font-size:9px;
 font-weight:850;
 text-align:right;
 white-space:nowrap;
 font-variant-numeric:tabular-nums
}
.empty{
 grid-column:1/-1;
 font-size:12px;
 font-weight:800;
 color:rgba(255,255,255,.68)
}
@media(max-width:900px){
 .board{gap:3px;padding:2px}
 .panel{grid-template-rows:17px minmax(0,1fr) minmax(0,1fr)}
 .dname{font-size:12px}
 .train{
   grid-template-columns:27px 70px 60px minmax(54px,1fr) 92px;
   gap:3px;
   padding:1px 4px
 }
 .time{font-size:18px}
 .type{font-size:9px}
 .dest{font-size:11px}
 .no{font-size:8px}
 .cd{font-size:8px}
}
</style>
</head>

// 方向別オフセット（秒）
const WEST_OFFSET_SEC=-10;  // 大阪方面
const EAST_OFFSET_SEC=-30;  // 伊勢方面
const HOLD_AFTER_ESTIMATE=20;

function jpNow(){
 const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",hour:"numeric",minute:"numeric",second:"numeric",hourCycle:"h23"})
 .formatToParts(new Date());
 const o={}; for(const x of p) if(x.type!=="literal") o[x.type]=Number(x.value);
 let s=o.hour*3600+o.minute*60+o.second; if(o.hour<4)s+=86400; return s;
}
function pad(n){return String(n).padStart(2,"0")}
function showTime(t){
 const r=Math.round(t/60)*60; return `${pad(Math.floor(r/3600)%24)}:${pad(Math.floor((r%3600)/60))}頃`;
}
function cls(t){
 if(["特急","V","ISL","UL","ひのとり","しまかぜ"].includes(t))return"limited";
 if(t==="快速急行")return"rapid";
 if(["急行","区間急行"].includes(t))return"express";
 if(["準急","区間準急"].includes(t))return"semi";
 return"local";
}
function label(t){
 return t==="UL"?"UL":t==="V"?"V":t==="ISL"?"ISL":t;
}
function count(delta){
 if(delta<=0)return"まもなく通過";
 const m=Math.floor(delta/60),s=Math.floor(delta%60);
 return m>99?"":`通過まで ${m}:${pad(s)}`;
}
function upcoming(list,now,offset){return list.filter(x=>(x.t+offset)>=now-HOLD_AFTER_ESTIMATE).slice(0,2)}
function render(id,r,i,now,offset){
 const el=document.getElementById(id);
 if(!r){el.innerHTML='<div class="empty">本日の案内終了</div>';return}
 const no=r.no?`<span class="no">${String(r.no).padStart(4,"0")}列車</span>`:"";
 const pt=r.t+offset;
 el.innerHTML=`
 <div class="tag" style="color:${i===0?'#ff3b30':'#34c759'}">${i===0?"先発":"次発"}</div>
 <div class="time">${showTime(pt)}</div>
 <div class="type ${cls(r.type)}">${label(r.type)}</div>
 <div class="dest">${r.dest}${no}</div>
 <div class="cd">${count(pt-now)}</div>`;
}
function update(){
 const now=jpNow();
 const w=upcoming(WEST,now,WEST_OFFSET_SEC);
 const e=upcoming(EAST,now,EAST_OFFSET_SEC);
 render("w1",w[0],0,now,WEST_OFFSET_SEC);
 render("w2",w[1],1,now,WEST_OFFSET_SEC);
 render("e1",e[0],0,now,EAST_OFFSET_SEC);
 render("e2",e[1],1,now,EAST_OFFSET_SEC);
}
update();setInterval(update,1000);
