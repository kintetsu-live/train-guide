<html lang="ja">
<head>
<meta charset="UTF-8">

<title>近鉄大阪線 次列車案内</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 padding:0;
 background:transparent;
 overflow:hidden;
 width:100%;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
 color:#fff;
}

body{
 display:flex;
 align-items:flex-end;
 justify-content:center;
 padding-bottom:1px;/* 下部の余白 */
}

.board{
 width:99.9vw;
 height:81px;
 display:grid;
 grid-template-columns:minmax(0,1fr) minmax(0,1fr);
 gap:3px;
 padding:2px;
 background:rgba(5,9,15,.90);
 border:1px solid rgba(255,255,255,.20);
 border-radius:6px;
 overflow:hidden;
 backdrop-filter:blur(4px);
 -webkit-backdrop-filter:blur(4px);
 opacity:0.99; /* 透過率 */

}
.panel{
 min-width:0;
 display:grid;
 grid-template-rows:13px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
 gap:1px;
 padding:1px;
 border-radius:5px;
 background:rgba(255,255,255,.035)
}
.panel.osaka{border-right:1px solid rgba(255,255,255,.12)}
.dir{
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:4px;
 background:rgba(255,255,255,.08);
 font-weight:900;
 white-space:nowrap
}
.dname{font-size:10px; /* 方向表示 */ letter-spacing:.02em}
.train{
 min-width:0;
 display:grid;
 grid-template-columns:22px 56px 50px minmax(84px,1fr) 50px;
 gap:3px;
 align-items:center;
 padding:1px 4px;
 border-radius:4px;
 background:rgba(255,255,255,.07)
}
.tag{
 font-size:7px; /* 先発・次発・次々発 */
 font-weight:900;
 letter-spacing:.06em;
 color:rgba(255,255,255,.70);
 white-space:nowrap
}
.time{
 font-size:14px; /* 推定通過時刻 */
 font-weight:950;
 line-height:1;
 font-variant-numeric:tabular-nums;
 white-space:nowrap;
 padding-right:1px;
 width:100%;
 text-align:center;
 position:relative;
 left:3px;
}
.type{
 justify-self:start;
 width:48px;
 padding:1px 4px;
 border-radius:4px;
 font-size:9px; /* 種別表示 */
 font-weight:950;
 white-space:nowrap;
 background:rgba(255,255,255,.15);
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 left:12px;
}
.type.limited{
 background:rgba(230,30,30,.95);
 border:1px solid #fff;
}
.type.shimakaze{
 background:rgba(50,170,255,.95);
 color:#ff0000;
}

.type.rapid{
 background:rgba(230,30,30,.95);}
.type.express{background:rgba(230,120,35,.90)}
.type.semi{background:rgba(43,127,87,.82)}
.type.local{background:rgba(44,100,163,.82)}
.dest{
 min-width:0;
 font-size:10px; /* 行先表示 */
 font-weight:900;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 padding-left:10px;
 position:relative;
 left:4px;
}
.no{
 font-size:7px; /* 列車番号 */
 font-weight:700;
 color:rgba(255,255,255,.66);
 margin-left:4px;
 white-space:nowrap
}
.cd{
 font-size:9px; /* カウントダウン */
 font-weight:850;
 text-align:right;
 white-space:nowrap;
 font-variant-numeric:tabular-nums;
 width:100%;
 min-width:0;
 justify-self:end;
 padding-right:1px;
}
.empty{
 grid-column:1/-1;
 font-size:9px; /* 案内終了表示 */
 font-weight:800;
 color:rgba(255,255,255,.68)
}
@media(max-width:900px){
 .board{gap:2px;padding:1px}
 .panel{grid-template-rows:12px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
 .train{
   grid-template-columns:19px 49px 50px minmax(63px,1fr) 50px;
   gap:2px;
   padding:1px 3px
 }
}
</style>
</head>

// 方向別オフセット（秒）
const WEST_OFFSET_SEC=0;  // 大阪方面
const EAST_OFFSET_SEC=0;  // 近鉄名古屋/賢島方面
const HOLD_AFTER_ESTIMATE=45;  // 通過表示遅延時間

function jpNow(){
 const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",hour:"numeric",minute:"numeric",second:"numeric",hourCycle:"h23"})
 .formatToParts(new Date());
 const o={}; for(const x of p) if(x.type!=="literal") o[x.type]=Number(x.value);
 let s=o.hour*3600+o.minute*60+o.second; if(o.hour<4)s+=86400; return s;
}
function pad(n){return String(n).padStart(2,"0")}
function showTime(t){
 const r=Math.round(t/60)*60; return `${pad(Math.floor(r/3600)%24)}:${pad(Math.floor((r%3600)/60))}頃`;
}
function cls(t){
 if(t==="特急 しまかぜ")return"shimakaze";
 if(["特急","特急 V","特急 ISL","特急 UL","ひのとり"].includes(t))return"limited";
 if(t==="快速急行")return"rapid";
 if(["急行","区間急行"].includes(t))return"express";
 if(["準急","区間準急"].includes(t))return"semi";
 return"local";
}
function label(t){
 return t==="特急 UL"?"特急 UL":t==="特急 V"?"特急 V":t==="特急 ISL"?"特急 ISL":t;
}
function destEn(dest){
 const map={
  "大阪上本町":"Osaka-Uehommachi",
  "大阪難波":"Osaka-Namba",
  "高安":"Takayasu",
  "河内国分":"Kawachi-Kokubu",
  "五位堂":"Goido",
  "大和八木":"Yamato-Yagi",
  "大和朝倉":"Yamato-Asakura",
  "榛原":"Haibara",
  "名張":"Nabari",
  "青山町":"Aoyamacho",
  "伊勢中川":"Ise-Nakagawa",
  "松阪":"Matsusaka",
  "宇治山田":"Ujiyamada",
  "五十鈴川":"Isuzugawa",
  "鳥羽":"Toba",
  "賢島":"Kashikojima",
  "近鉄名古屋":"Kintetsu-Nagoya"
 };
 const en=map[dest]||"";
 return en?`<span style="font-size:6px;font-weight:700;color:rgba(255,255,255,.72);margin-left:5px;white-space:nowrap">${en}</span>`:"";
}
function count(delta){
 if(delta<=0)return"通過";
 const m=Math.floor(delta/60),s=Math.floor(delta%60);
 return m>99?"":`${m}:${pad(s)}`;
}
function upcoming(list,now,offset){return list.filter(x=>(x.t+offset)>=now-HOLD_AFTER_ESTIMATE).slice(0,3)}
function render(id,r,i,now,offset){
 const el=document.getElementById(id);
 if(!r){el.innerHTML='<div class="empty">本日の運転は、終了しました。</div>';return}
 const no=r.no?`<span class="no">${String(r.no).padStart(4,"0")}列車</span>`:"";
 const pt=r.t+offset;
 el.innerHTML=`
 <div class="tag" style="color:${i===0?'#ff3b30':i===1?'#34c759':'#ffffff'}">${["先発","次発","次々発"][i]}</div>
 <div class="time">${showTime(pt)}</div>
 <div class="type ${cls(r.type)}">${label(r.type)}</div>
 <div class="dest">${r.dest}${destEn(r.dest)}${no}</div>
 <div class="cd">${count(pt-now)}</div>`;
}
function update(){
 const now=jpNow();
 const w=upcoming(WEST,now,WEST_OFFSET_SEC);
 const e=upcoming(EAST,now,EAST_OFFSET_SEC);
 render("w1",w[0],0,now,WEST_OFFSET_SEC);
 render("w2",w[1],1,now,WEST_OFFSET_SEC);
 render("w3",w[2],2,now,WEST_OFFSET_SEC);
 render("e1",e[0],0,now,EAST_OFFSET_SEC);
 render("e2",e[1],1,now,EAST_OFFSET_SEC);
 render("e3",e[2],2,now,EAST_OFFSET_SEC);
}
update();setInterval(update,1000);
