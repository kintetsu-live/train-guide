<meta charset="UTF-8">

<title>大和西大寺駅東側 次列車案内（平日）</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 padding:0;
 background:transparent;
 overflow:hidden;
 width:100%;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
 color:#fff;
}

body{
 position:relative;
}

.stack{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
}

.board{
 position:absolute;
 left:50%;
 transform:translateX(-50%);
 width:99.9vw;
 height:81px;
 display:grid;
 grid-template-columns:minmax(0,1fr) minmax(0,1fr);
 gap:3px;
 padding:2px;
 background:rgba(5,9,15,.95);
 border:1px solid rgba(255,255,255,.20);
 border-radius:6px;
 overflow:hidden;
 backdrop-filter:blur(4px);
 -webkit-backdrop-filter:blur(4px);
 opacity:1; /* 透過率 */

}
.board.top{top:1px;}
.board.bottom{bottom:1px;}
.panel{
 min-width:0;
 display:grid;
 grid-template-rows:13px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);
 gap:1px;
 padding:1px;
 border-radius:5px;
 background:rgba(255,255,255,.035)
}
.panel.osaka{border-right:1px solid rgba(255,255,255,.12)}
.dir{
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:4px;
 background:rgba(255,255,255,.08);
 font-weight:900;
 white-space:nowrap
}
.dname{font-size:10px; /* 方向表示 */ letter-spacing:.02em}
.train{
 min-width:0;
 display:grid;
 grid-template-columns:22px 56px 50px minmax(84px,1fr) 50px;
 gap:3px;
 align-items:center;
 padding:1px 4px;
 border-radius:4px;
 background:rgba(255,255,255,.07)
}
.tag{
 font-size:7px; /* 先発・次発・次々発 */
 font-weight:900;
 letter-spacing:.06em;
 color:rgba(255,255,255,.70);
 white-space:nowrap
}
.time{
 font-size:14px; /* 推定通過時刻 */
 font-weight:950;
 line-height:1;
 font-variant-numeric:tabular-nums;
 white-space:nowrap;
 padding-right:1px;
 width:100%;
 text-align:center;
 position:relative;
 left:3px;
}
.type{
 justify-self:start;
 width:48px;
 padding:1px 4px;
 border-radius:4px;
 font-size:9px; /* 種別表示 */
 font-weight:950;
 white-space:nowrap;
 background:rgba(255,255,255,.15);
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
 left:12px;
}
.type.limited{
 background:rgba(230,30,30,.95);
 border:1px solid #fff;
}
.type.shimakaze{
 background:rgba(50,170,255,.95);
 color:#fff;
}

.type.rapid{
 background:rgba(230,30,30,.95);}
.type.express{background:rgba(230,120,35,.90)}
.type.semi{background:rgba(43,127,87,.82)}
.type.local{background:rgba(44,100,163,.82)}
.type.deadhead{background:#fff;color:#000}
.dest{
 min-width:0;
 font-size:10px; /* 行先表示 */
 font-weight:900;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 padding-left:10px;
 position:relative;
 left:4px;
}
.no{
 font-size:7px; /* 列車番号 */
 font-weight:700;
 color:rgba(255,255,255,.66);
 margin-left:4px;
 white-space:nowrap
}
.cd{
 font-size:9px; /* カウントダウン */
 font-weight:850;
 text-align:right;
 white-space:nowrap;
 font-variant-numeric:tabular-nums;
 width:100%;
 min-width:0;
 justify-self:end;
 padding-right:1px;
}
.empty{
 grid-column:1/-1;
 font-size:9px; /* 案内終了表示 */
 font-weight:800;
 color:rgba(255,255,255,.68)
}
@media(max-width:900px){
 .board{gap:2px;padding:1px}
 .panel{grid-template-rows:12px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
 .train{
   grid-template-columns:19px 49px 50px minmax(63px,1fr) 50px;
   gap:2px;
   padding:1px 3px
 }
}
</style>
</head>

// 撮影地点は大和西大寺駅のすぐ東側。
// 到着列車：大和西大寺到着基準 - APPROACH_OFFSET_SEC
// 発車列車：大和西大寺発車基準 + DEPARTURE_OFFSET_SEC
// 20秒は現地合わせ用の初期値で、公式時刻ではありません。
const NARA_APPROACH_OFFSET_SEC=20;
const NARA_DEPARTURE_OFFSET_SEC=20;
const KASHI_APPROACH_OFFSET_SEC=20;
const KASHI_DEPARTURE_OFFSET_SEC=20;
const HOLD_AFTER_ESTIMATE=60;  // 通過表示遅延時間

function jpNow(){
 const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",hour:"numeric",minute:"numeric",second:"numeric",hourCycle:"h23"})
 .formatToParts(new Date());
 const o={}; for(const x of p) if(x.type!=="literal") o[x.type]=Number(x.value);
 let s=o.hour*3600+o.minute*60+o.second; if(o.hour<4)s+=86400; return s;
}
function pad(n){return String(n).padStart(2,"0")}
function showTime(t){
 const r=Math.round(t/60)*60; return `${pad(Math.floor(r/3600)%24)}:${pad(Math.floor((r%3600)/60))}頃`;
}
function cls(t){
 if(t==="しまかぜ")return"shimakaze";
 if(["特急","特急 V","特急 ISL","特急 UL","ひのとり","あをによし"].includes(t))return"limited";
 if(t==="快速急行")return"rapid";
 if(["急行","区間急行"].includes(t))return"express";
 if(["準急","区間準急"].includes(t))return"semi";
 if(t==="回送")return"deadhead";
 return"local";
}
function label(t){
 return t==="特急 UL"?"特急 UL":t==="特急 V"?"特急 V":t==="特急 ISL"?"特急 ISL":t;
}
function destEn(dest){
 const map={
  "近鉄奈良":"Kintetsu-Nara",
  "大和西大寺":"Yamato-Saidaiji",
  "東花園":"Higashi-Hanazono",
  "大阪難波":"Osaka-Namba",
  "尼崎":"Amagasaki",
  "神戸三宮":"Kobe-Sannomiya",
  "京都":"Kyoto",
  "国際会館":"Kokusaikaikan",
  "橿原神宮前":"Kashiharajingu-mae",
  "天理":"Tenri",
  "鳥羽":"Toba",
  "賢島":"Kashikojima",
  "新田辺":"Shin-Tanabe"
 };
 const en=map[dest]||"";
 return en?`<span style="font-size:6px;font-weight:700;color:rgba(255,255,255,.72);margin-left:5px;white-space:nowrap">${en}</span>`:"";
}
function count(delta){
 if(delta<=15)return"接近";
 const m=Math.floor(delta/60),s=Math.floor(delta%60);
 return m>99?"":`${m}:${pad(s)}`;
}
function passTime(r,offset,mode){return mode==="arr"?r.t-offset:r.t+offset}
function upcoming(list,now,offset,mode){return list.filter(x=>passTime(x,offset,mode)>=now-HOLD_AFTER_ESTIMATE).slice(0,3)}
function render(id,r,i,now,offset,mode){
 const el=document.getElementById(id);
 if(!r){el.innerHTML='<div class="empty">本日の運転は、終了しました。</div>';return}
 const no=r.no?`<span class="no">${String(r.no).padStart(4,"0")}列車</span>`:"";
 const pt=passTime(r,offset,mode);
 el.innerHTML=`
 <div class="tag" style="color:${i===0?'#ff3b30':i===1?'#34c759':'#ffffff'}">${["先発","次発","次々発"][i]}</div>
 <div class="time">${showTime(pt)}</div>
 <div class="type ${cls(r.type)}">${label(r.type)}</div>
 <div class="dest">${r.dest}${no}${destEn(r.dest)}</div>
 <div class="cd">${count(pt-now)}</div>`;
}
function renderGroup(prefix,list,now,offset,mode){
 const rows=upcoming(list,now,offset,mode);
 render(prefix+"1",rows[0],0,now,offset,mode);
 render(prefix+"2",rows[1],1,now,offset,mode);
 render(prefix+"3",rows[2],2,now,offset,mode);
}
function update(){
 const now=jpNow();
 // 上段：橿原線
 renderGroup("kw",KASHI_WEST,now,KASHI_APPROACH_OFFSET_SEC,"arr");
 renderGroup("ke",KASHI_EAST,now,KASHI_DEPARTURE_OFFSET_SEC,"dep");
 // 下段：奈良線・京都線
 renderGroup("w",WEST,now,NARA_APPROACH_OFFSET_SEC,"arr");
 renderGroup("e",EAST,now,NARA_DEPARTURE_OFFSET_SEC,"dep");
}
update();setInterval(update,1000);
</script>
